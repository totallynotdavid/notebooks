[project]
name = "notebooks"
version = "0.1.0"
readme = "readme.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "lib/*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]
# Allow these Unicode characters in lesson text.
allowed-confusables = ["×", "σ", "–", "−"]

[dependency-groups]
dev = [
    { include-group = "lint" },
]
lint = [
    "ruff>=0.17.6",
]
