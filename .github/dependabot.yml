version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pymdown-extensions
      - dependency-name: typescript
      - dependency-name: uv

  - package-ecosystem: uv
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pymdown-extensions
      - dependency-name: typescript
      - dependency-name: uv

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: pymdown-extensions
      - dependency-name: typescript
      - dependency-name: uv
