[project]
name = "quire"
version = "0.1.0"
description = "Runs Markdown articles with Python fences and writes the document the site renders."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.5",
]

[project.scripts]
quire = "quire.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
