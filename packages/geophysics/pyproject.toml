[project]
name = "geophysics"
version = "0.1.0"
dependencies = [
    "certifi>=2026.10.23",
    "contourpy>=1.4.0",
    "numpy>=2.5.5",
    "obspy>=1.5.1",
    "quire",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[tool.uv.sources]
quire = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adquisicion", "ingemmet_peligros", "tsunamis"]
